name: weconnect-client

services:
  weconnect-client:
    build:
      dockerfile: docker/Dockerfile.dev
      args:
        - HTTPS_SSL_HOST=${HOSTNAME:-wevotedeveloper.com}
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=4000
      - PROTOCOL=HTTPS
#      - HTTPS_SSL_CERT=${HTTPS_SSL_CERT:-/etc/ssl/certs/cert.pem}    # As a fallback, use automatically created cert
#      - HTTPS_SSL_KEY=${HTTPS_SSL_KEY:-/etc/ssl/private/key.pem}    # As a fallback, use automatically created key
    volumes:
      - .:/app
      # Prevent the host node_modules from shadowing the container's installed node_modules
      - node_modules:/app/node_modules
    ports:
      - "127.0.0.1:4000:4000" # access the WeConnect Client at http://localhost:4000
    networks:
      - wevote

networks:
  wevote:
    name: wevote
    external: true

volumes:
  node_modules:
